<style>
  .fast-stats-backdrop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15, 23, 42, 0.62); z-index: 2400; }
  .fast-stats-backdrop[hidden] { display: none; }
  .fast-stats-modal { width: min(1380px, 100%); max-height: 92vh; overflow: auto; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28); padding: 22px; }
  .fast-stats-topbar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
  .fast-stats-topbar h2 { margin: 0; font-size: 1.18rem; }
  .fast-stats-topbar p { margin: 6px 0 0; color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
  .fast-stats-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fast-stats-summary { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 16px 0; }
  .fast-stats-card { border: 1px solid var(--border); border-radius: 14px; background: rgba(111, 60, 195, 0.04); padding: 14px; }
  .fast-stats-card .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .fast-stats-card .value { margin-top: 8px; font-size: 1.5rem; font-weight: 800; color: var(--accent-strong); }
  .fast-stats-card .meta { margin-top: 6px; font-size: 0.82rem; color: var(--muted); }
  .fast-stats-mode { display: none; }
  .fast-stats-mode.active { display: block; }
  .fast-stats-sheet { font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
  .fast-stats-table { min-width: 960px; }
  .fast-stats-table th, .fast-stats-table td { vertical-align: middle; text-transform: none; letter-spacing: 0; }
  .fast-stats-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .fast-stats-link { color: var(--accent-strong); font-weight: 700; text-decoration: none; }
  .fast-stats-link:hover { text-decoration: underline; }
  .fast-stats-link-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); text-decoration: none; font-weight: 700; }
  .fast-stats-link-badge.teams { background: rgba(98, 100, 167, 0.12); border-color: rgba(98, 100, 167, 0.24); color: #4f46e5; }
  .fast-stats-link-badge.analysis { background: rgba(15, 139, 141, 0.08); border-color: rgba(15, 139, 141, 0.2); color: #0f5f61; }
  .fast-stats-empty { padding: 28px; text-align: center; color: var(--muted); }
  .fast-stats-error { padding: 16px; border: 1px solid rgba(190, 24, 93, 0.2); border-radius: 12px; background: rgba(190, 24, 93, 0.06); color: #9f1239; }
  @media (max-width: 720px) {
    .fast-stats-backdrop { padding: 12px; }
    .fast-stats-modal { padding: 16px; }
  }
</style>

<div id="js-fast-stats-modal" class="fast-stats-backdrop" hidden>
  <div
    class="fast-stats-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="js-fast-stats-title"
    data-api-url="{% url 'fast_stats_api' %}"
    data-export-url="{% url 'fast_stats_export_xlsx' %}"
    data-class-base-url="{% url 'class_analysis_detail' 'PLACEHOLDER' %}"
    data-default-mode="{{ fast_stats_default_mode }}"
  >
    <div class="fast-stats-topbar">
      <div>
        <h2 id="js-fast-stats-title">FAST STATS</h2>
        <p>Prévisualisation et export des feuilles <strong>Enquête de satisfaction</strong> et <strong>Enquête de formateur</strong>, alimentées à partir des données plateforme et exposées aussi via API JSON.</p>
      </div>
      <div class="fast-stats-actions">
        <a id="js-fast-stats-export" class="btn btn-primary btn-sm" href="{% url 'fast_stats_export_xlsx' %}?fast_stats_mode={{ fast_stats_default_mode }}">Télécharger le fichier</a>
        <button type="button" class="btn btn-ghost btn-sm" id="js-fast-stats-close">Fermer</button>
      </div>
    </div>

    <div class="scope-tabs" role="tablist" aria-label="Choix du jeu de données FAST STATS">
      <button type="button" class="scope-tab {% if fast_stats_default_mode == 'apprenant' %}active{% endif %}" data-fast-stats-tab="apprenant">Apprenant</button>
      <button type="button" class="scope-tab {% if fast_stats_default_mode == 'general' %}active{% endif %}" data-fast-stats-tab="general">General</button>
      <button type="button" class="scope-tab {% if fast_stats_default_mode == 'padesce' %}active{% endif %}" data-fast-stats-tab="padesce">Padesce</button>
      <button type="button" class="scope-tab {% if fast_stats_default_mode == 'formateur' %}active{% endif %}" data-fast-stats-tab="formateur">Formateur</button>
      <button type="button" class="scope-tab {% if fast_stats_default_mode == 'descentes' %}active{% endif %}" data-fast-stats-tab="descentes">Descentes</button>
    </div>

    <div id="js-fast-stats-content" class="fast-stats-content">
      <div class="fast-stats-empty">Chargement des données FAST STATS…</div>
    </div>
  </div>
</div>

<script>
  (function () {
    const openButton = document.getElementById("js-open-fast-stats");
    const modal = document.getElementById("js-fast-stats-modal");
    const modalCard = modal ? modal.querySelector(".fast-stats-modal") : null;
    const closeButton = document.getElementById("js-fast-stats-close");
    const exportButton = document.getElementById("js-fast-stats-export");
    const content = document.getElementById("js-fast-stats-content");
    if (!openButton || !modal || !modalCard || !closeButton || !exportButton || !content) return;

    const apiUrl = modalCard.dataset.apiUrl;
    const exportUrl = modalCard.dataset.exportUrl;
    const classBaseUrl = modalCard.dataset.classBaseUrl;
    let activeMode = modalCard.dataset.defaultMode || "apprenant";
    let bundle = null;
    let lastQueryKey = "";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function displayValue(value) {
      return value === null || value === undefined || value === "" ? "—" : escapeHtml(value);
    }

    function renderClassLink(row) {
      if (!row.class_link_url) return "—";
      const kind = row.class_link_kind === "teams" ? "teams" : "analysis";
      const icon = kind === "teams" ? "fa-brands fa-microsoft" : "fa-solid fa-arrow-up-right-from-square";
      return `<a class="fast-stats-link-badge ${kind}" href="${escapeHtml(row.class_link_url)}" target="_blank" rel="noreferrer"><i class="${icon}"></i><span>${displayValue(row.class_link_label)}</span></a>`;
    }

    function buildExportHref(mode) {
      const url = new URL(exportUrl, window.location.origin);
      const params = new URLSearchParams(window.location.search);
      params.set("fast_stats_mode", mode);
      url.search = params.toString();
      return url.toString();
    }

    function renderSummary(cards) {
      return `<div class="fast-stats-summary">${cards.map((card) => `
        <div class="fast-stats-card">
          <div class="label">${escapeHtml(card.label)}</div>
          <div class="value">${displayValue(card.value)}</div>
          <div class="meta">${escapeHtml(card.meta || "")}</div>
        </div>
      `).join("")}</div>`;
    }

    function renderApprenantTable(mode) {
      const rows = mode.rows || [];
      const body = rows.length ? rows.map((row) => `
        <tr>
          <td class="num">${displayValue(row.index)}</td>
          <td>${displayValue(row.prestation_id)}</td>
          <td><a class="fast-stats-link" href="${classBaseUrl ? classBaseUrl.replace('PLACEHOLDER', encodeURIComponent(row.classe_id)) : '#'}" target="_blank" rel="noreferrer">${displayValue(row.classe_id)}</a></td>
          <td class="num">${displayValue(row.apprenant_count)}</td>
          <td class="num">${displayValue(row.calls_effectues)}</td>
          <td class="num">${displayValue(row.calls_termines)}</td>
          <td class="num">${displayValue(row.pct_appel_effectue_label)}</td>
          <td class="num">${displayValue(row.pct_appel_termine_label)}</td>
          <td class="num">${displayValue(row.pct_enquetes_label)}</td>
        </tr>
      `).join("") : `<tr><td colspan="9" class="fast-stats-empty">Aucune donnée FAST STATS disponible pour les filtres courants.</td></tr>`;
      return `
        <div class="table-scroll" style="max-height:60vh;">
          <table class="fast-stats-table">
            <thead>
              <tr>
                <th>#</th><th>Prestation ID</th><th>Classe ID</th><th>Nombre d'apprenant inscrit</th>
                <th>Nbre d'appels effectués</th><th>Nombre d'appels terminé</th>
                <th>% appel effectué</th><th>% appel terminé</th><th>% enquêtes</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    function renderGeneralTable(mode) {
      const rows = mode.rows || [];
      if (!rows.length) {
        return `<div class="fast-stats-empty">Aucune donnée FAST STATS disponible pour les filtres courants.</div>`;
      }

      const row = rows[0]; // Get the global row

      // Format base values with appropriate units
      const formatBase = (val, metric) => {
        if (val == null) return "—";
        if (metric.startsWith("resp_") || metric === "taux_presence") {
          return `${val.toFixed(0)}%`;
        } else if (metric === "qualite_environnement") {
          return `${val.toFixed(1)}/13`;
        } else if (metric.includes("satisfaction")) {
          return `${val.toFixed(1)}/5`;
        } else if (metric === "attitude_enquete") {
          return `${val.toFixed(1)}/10`;
        }
        return `${val.toFixed(1)}`;
      };

      // Format scaled values
      const formatScale = (val, scale) => {
        if (val == null) return "—";
        return `${val.toFixed(1)}/${scale}`;
      };

      // Build the metrics table
      const metrics = [
        { label: "Taux de présence", base: formatBase(row.taux_presence_base, "taux_presence"), scale: formatScale(row.taux_presence, row.taux_presence_scale) },
        { label: "Resp horaire", base: formatBase(row.resp_horaire_base, "resp_horaire"), scale: formatScale(row.resp_horaire, row.resp_horaire_scale) },
        { label: "Resp thème", base: formatBase(row.resp_theme_base, "resp_theme"), scale: formatScale(row.resp_theme, row.resp_theme_scale) },
        { label: "Resp parité", base: formatBase(row.resp_parité_base, "resp_parité"), scale: formatScale(row.resp_parité, row.resp_parité_scale) },
        { label: "Qualité environnement", base: formatBase(row.qualite_environnement_base, "qualite_environnement"), scale: formatScale(row.qualite_environnement, row.qualite_environnement_scale) },
        { label: "Satisfaction apprenant", base: formatBase(row.satisfaction_apprenant_base, "satisfaction_apprenant"), scale: formatScale(row.satisfaction_apprenant, row.satisfaction_apprenant_scale) },
        { label: "Satis faction formateur", base: formatBase(row.satisfaction_formateur_base, "satisfaction_formateur"), scale: formatScale(row.satisfaction_formateur, row.satisfaction_formateur_scale) },
        { label: "Attitude enquête / respect consigne", base: formatBase(row.attitude_enquete_base, "attitude_enquete"), scale: formatScale(row.attitude_enquete, row.attitude_enquete_scale) },
      ];

      const tableBody = metrics.map(m => `
        <tr>
          <td style="text-align: left; font-weight: 600;">${escapeHtml(m.label)}</td>
          <td class="num">${displayValue(m.base)}</td>
          <td class="num" style="font-weight: 700;">${displayValue(m.scale)}</td>
        </tr>
      `).join("");

      return `
        <div class="table-scroll" style="max-height:60vh;">
          <table class="fast-stats-table">
            <thead>
              <tr>
                <th style="text-align: left;">Métrique</th>
                <th>Base</th>
                <th>Échelles</th>
              </tr>
            </thead>
            <tbody>${tableBody}</tbody>
          </table>
        </div>`;
    }

    function renderPadesceTable(mode) {
      const rows = mode.rows || [];
      if (!rows.length) {
        return `<div class="fast-stats-empty">Aucune donnée FAST STATS disponible pour les filtres courants.</div>`;
      }

      // Helpers
      const fPct  = v => v == null ? "—" : `${v.toFixed(1)}%`;       // base % (0-100)
      const fOn13 = v => v == null ? "—" : `${v.toFixed(2)}/13`;     // qualité env base
      const fOn5  = v => v == null ? "—" : `${v.toFixed(2)}/5`;      // satisfaction base
      const fOn10 = v => v == null ? "—" : `${v.toFixed(2)}/10`;     // attitude base
      const fScore = (v, max) => v == null ? "—" : `${v.toFixed(2)}/${max}`;

      const tableRows = rows.map(row => {
        const note = row.note_globale != null ? row.note_globale.toFixed(2) : "—";
        return `
          <tr>
            <td class="num">${displayValue(row.index)}</td>
            <td style="font-weight:700;">${displayValue(row.prestation_id)}</td>
            <td class="num">${displayValue(row.classe_count)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fPct(row.taux_presence_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.taux_presence, 20)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fPct(row.resp_horaire_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.resp_horaire, 10)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fPct(row.resp_theme_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.resp_theme, 10)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fPct(row.resp_parité_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.resp_parité, 10)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fOn13(row.qualite_environnement_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.qualite_environnement, 10)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fOn5(row.satisfaction_apprenant_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.satisfaction_apprenant, 20)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fOn5(row.satisfaction_formateur_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.satisfaction_formateur, 10)}</td>
            <td class="num" style="color:var(--muted);font-size:0.8rem;">${fOn10(row.attitude_enquete_base)}</td>
            <td class="num" style="font-weight:600;">${fScore(row.attitude_enquete, 10)}</td>
            <td class="num" style="font-weight:900;color:var(--accent-strong);font-size:0.95rem;">${escapeHtml(note)}/100</td>
          </tr>`;
      }).join("");

      return `
        <div class="table-scroll" style="max-height:60vh;">
          <table class="fast-stats-table" style="font-size:0.8rem;">
            <thead>
              <tr>
                <th rowspan="2">#</th>
                <th rowspan="2" style="text-align:left;">Prestation</th>
                <th rowspan="2">Classes</th>
                <th colspan="2">Taux présence</th>
                <th colspan="2">Resp horaire</th>
                <th colspan="2">Resp thème</th>
                <th colspan="2">Resp parité</th>
                <th colspan="2">Qualité env.</th>
                <th colspan="2">Sat. apprenant</th>
                <th colspan="2">Sat. formateur</th>
                <th colspan="2">Attitude enquête</th>
                <th rowspan="2" style="color:var(--accent-strong);">Note /100</th>
              </tr>
              <tr>
                <th style="color:var(--muted);">Base</th><th>Score /20</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
                <th style="color:var(--muted);">Base</th><th>Score /20</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
                <th style="color:var(--muted);">Base</th><th>Score /10</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>`;
    }

    function renderFormateurTable(mode) {
      const rows = mode.rows || [];
      const body = rows.length ? rows.map((row) => `
        <tr>
          <td class="num">${displayValue(row.index)}</td>
          <td>${displayValue(row.prestation_id)}</td>
          <td><a class="fast-stats-link" href="${classBaseUrl ? classBaseUrl.replace('PLACEHOLDER', encodeURIComponent(row.classe_id)) : '#'}" target="_blank" rel="noreferrer">${displayValue(row.classe_id)}</a></td>
          <td>${renderClassLink(row)}</td>
          <td>${displayValue(row.beneficiaire_name)}</td>
          <td>${displayValue(row.prestataire_name)}</td>
          <td>${displayValue(row.calendar_contacts?.[0]?.name)}</td>
          <td>${displayValue(row.calendar_contacts?.[0]?.phone)}</td>
          <td>${displayValue(row.calendar_contacts?.[1]?.name)}</td>
          <td>${displayValue(row.calendar_contacts?.[1]?.phone)}</td>
          <td>${displayValue(row.descente_contacts?.[0]?.name)}</td>
          <td>${displayValue(row.descente_contacts?.[0]?.phone)}</td>
          <td>${displayValue(row.descente_contacts?.[1]?.name)}</td>
          <td>${displayValue(row.descente_contacts?.[1]?.phone)}</td>
          <td>${displayValue(row.descente_contacts?.[2]?.name)}</td>
          <td>${displayValue(row.descente_contacts?.[2]?.phone)}</td>
          <td>${displayValue(row.descente_contacts?.[3]?.name)}</td>
          <td>${displayValue(row.descente_contacts?.[3]?.phone)}</td>
        </tr>
      `).join("") : `<tr><td colspan="18" class="fast-stats-empty">Aucune donnée FAST STATS disponible pour les filtres courants.</td></tr>`;
      return `
        <div class="table-scroll" style="max-height:60vh;">
          <table class="fast-stats-table">
            <thead>
              <tr>
                <th colspan="6">Structure classe</th>
                <th colspan="4">Selon Calendrier</th>
                <th colspan="8">Selon Descente</th>
              </tr>
              <tr>
                <th>#</th><th>Prestation ID</th><th>Classe ID</th><th>Lien du canal</th><th>Nom du bénéficiaire</th><th>Nom du prestataire</th>
                <th>Nom Formateur N1</th><th>Numero formateur N1</th><th>Nom Formateur N2</th><th>Numero formateur N2</th>
                <th>Nom Formateur N1</th><th>Numero formateur N1</th><th>Nom Formateur N2</th><th>Numero formateur N2</th>
                <th>Nom Formateur N3</th><th>Numero formateur N3</th><th>Nom Formateur N4</th><th>Numero formateur N4</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    function renderDescentesTable(mode) {
      const groups = mode.row_groups || [];
      if (!groups.length) return `<div class="fast-stats-empty">Aucune donnée.</div>`;

      return groups.map((group) => {
        const isSF = group.id === "sf";
        const rows = group.rows || [];
        const thStyle = isSF
          ? "background:#1F4E79;color:#fff;"
          : "background:#375623;color:#fff;";

        const head = isSF
          ? `<tr style="${thStyle}"><th>#</th><th>Code</th><th>Lien des enquêtes</th><th>Type</th><th>Statut</th><th>Liens CSV</th><th>Bénéficiaire</th><th>Formation</th></tr>`
          : `<tr style="${thStyle}"><th>#</th><th>Classe</th><th>Lien des enquêtes</th><th>Type (H)</th><th>Statut (J)</th><th>Liens CSV (P)</th><th>Prestataire</th><th>Bénéficiaire</th></tr>`;

        const body = rows.length ? rows.map((row) => `
          <tr>
            <td class="num">${displayValue(row.index)}</td>
            <td><strong>${escapeHtml(row.code)}</strong></td>
            <td><a class="fast-stats-link" href="${escapeHtml(row.enquete_url)}" target="_blank" rel="noreferrer">Lien des enquêtes</a></td>
            <td><span style="font-weight:700;color:${isSF ? '#1F4E79' : '#375623'};">${escapeHtml(row.type)}</span></td>
            <td>${escapeHtml(row.statut)}</td>
            <td><a class="fast-stats-link" href="${escapeHtml(row.csv_url)}" target="_blank" rel="noreferrer">Liens CSV</a></td>
            <td>${displayValue(isSF ? row.beneficiaire : row.prestataire)}</td>
            <td>${displayValue(isSF ? row.formation : row.beneficiaire)}</td>
          </tr>
        `).join("") : `<tr><td colspan="8" class="fast-stats-empty">Aucune ligne.</td></tr>`;

        return `
          <div style="margin-bottom:24px;">
            <div style="font-weight:700;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:${isSF ? 'rgba(31,78,121,0.1)' : 'rgba(55,86,35,0.1)'};">
              ${escapeHtml(group.label)} — <span style="color:var(--muted);font-weight:400;">${rows.length} ligne(s)</span>
            </div>
            <div class="table-scroll" style="max-height:40vh;">
              <table class="fast-stats-table">
                <thead>${head}</thead>
                <tbody>${body}</tbody>
              </table>
            </div>
          </div>`;
      }).join("");
    }

    function renderMode(mode) {
      const meta = mode.metadata || {};
      let table;
      if (mode.id === "descentes") {
        table = renderDescentesTable(mode);
      } else if (mode.id === "formateur") {
        table = renderFormateurTable(mode);
      } else if (mode.id === "padesce") {
        table = renderPadesceTable(mode);
      } else if (mode.id === "general") {
        table = renderGeneralTable(mode);
      } else {
        table = renderApprenantTable(mode);
      }
      return `
        <section class="fast-stats-mode ${mode.id === activeMode ? "active" : ""}" data-fast-stats-panel="${escapeHtml(mode.id)}">
          ${renderSummary(mode.summary_cards || [])}
          <div class="source-note">${escapeHtml(meta.terminated_only_label || "")} : <strong>${meta.terminated_only_value ? "TRUE" : "FALSE"}</strong> · ${escapeHtml(meta.scope_label || "")} · ${escapeHtml(mode.note || "")}</div>
          <div class="fast-stats-sheet">Feuille cible : <strong>${escapeHtml(mode.sheet_name || "")}</strong></div>
          ${table}
        </section>`;
    }

    function renderBundle() {
      const modes = bundle?.modes || [];
      content.innerHTML = modes.length ? modes.map(renderMode).join("") : '<div class="fast-stats-empty">Aucune donnée FAST STATS disponible.</div>';
      activateMode(activeMode);
    }

    function activateMode(mode) {
      activeMode = mode;
      document.querySelectorAll("[data-fast-stats-tab]").forEach((button) => {
        button.classList.toggle("active", button.dataset.fastStatsTab === mode);
      });
      document.querySelectorAll("[data-fast-stats-panel]").forEach((panel) => {
        panel.classList.toggle("active", panel.dataset.fastStatsPanel === mode);
      });
      exportButton.href = buildExportHref(mode);
    }

    async function loadBundle() {
      const queryKey = window.location.search;
      if (bundle && lastQueryKey === queryKey) {
        renderBundle();
        return;
      }
      content.innerHTML = '<div class="fast-stats-empty">Chargement des données FAST STATS…</div>';
      const url = new URL(apiUrl, window.location.origin);
      url.search = new URLSearchParams(window.location.search).toString();
      try {
        const response = await fetch(url.toString(), { credentials: "same-origin", headers: { Accept: "application/json" } });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Impossible de charger FAST STATS.");
        bundle = payload;
        lastQueryKey = queryKey;
        renderBundle();
      } catch (error) {
        content.innerHTML = `<div class="fast-stats-error">${escapeHtml(error.message || "Impossible de charger FAST STATS.")}</div>`;
      }
    }

    function openModal() { modal.hidden = false; document.body.style.overflow = "hidden"; void loadBundle(); }
    function closeModal() { modal.hidden = true; document.body.style.overflow = ""; }

    openButton.addEventListener("click", openModal);
    closeButton.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !modal.hidden) closeModal(); });
    document.querySelectorAll("[data-fast-stats-tab]").forEach((button) => {
      button.addEventListener("click", () => activateMode(button.dataset.fastStatsTab));
    });

    activateMode(activeMode);
  })();
</script>
