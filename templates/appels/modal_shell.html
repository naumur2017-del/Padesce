<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PADESCE{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #2a1842;
      --muted: #7d68a3;
      --accent: #6f3cc3;
      --accent-strong: #4c1d95;
      --border: #e6def4;
      --shadow: 0 12px 30px rgba(76, 29, 149, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Poppins", sans-serif;
    }
    .shell {
      padding: 18px;
    }
    .message-stack {
      margin-bottom: 12px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #faf7ff;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="shell">
    {% if messages %}
      <div class="message-stack">
        {% for message in messages %}
          <div class="msg">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
