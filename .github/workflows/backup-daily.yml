name: Daily Backup And Digest

# GitHub Actions utilise UTC.
# Africa/Lagos est UTC+1: 16:00 UTC = 17:00 Lagos, 16:30 UTC = 17:30 Lagos.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-backup-digest
  cancel-in-progress: false

jobs:
  backup-and-digest:
    name: Backup + Daily Digest
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      BACKUP_TRIGGER_URL: https://call.naumur.com/backup/api/trigger/
      BACKUP_STATUS_URL_BASE: https://call.naumur.com/backup/api/trigger-status
      REPORT_DIGEST_TRIGGER_URL: https://call.naumur.com/reporting/api/daily-digest/trigger/
      BACKUP_RETENTION_DAYS: "30"
      HUGGINGFACE_SYNC_REQUIRED: "1"
      HUGGINGFACE_SPACE_URL: https://jackbrayan17-padesce-bot.hf.space
      HUGGINGFACE_HEALTH_MAX_SECONDS: "120"
      HUGGINGFACE_HEALTH_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN || secrets.HF_TOKEN }}
      DAILY_DIGEST_RECIPIENTS: keunicetchoup@gmail.com,tanayves96@gmail.com,crepinkoulo@gmail.com,djonmarcel84@gmail.com,brayaneyoum@naumur.com
      DIGEST_TRIGGER_UTC: "16:30"

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.BACKUP_TRIGGER_TOKEN }}" ]; then
            echo "::error::Le secret BACKUP_TRIGGER_TOKEN n'est pas configure dans l'environnement 'production'."
            echo "::notice::Ajoutez BACKUP_TRIGGER_TOKEN dans GitHub -> Settings -> Environments -> production -> Secrets."
            exit 1
          fi
          if [ -z "$HUGGINGFACE_HEALTH_TOKEN" ]; then
            echo "::error::Le secret HUGGINGFACE_TOKEN (ou HF_TOKEN) est requis pour verifier et synchroniser le Space prive."
            echo "::notice::Ajoutez HUGGINGFACE_TOKEN dans GitHub -> Settings -> Environments -> production -> Secrets."
            exit 1
          fi

      - name: Trigger backup via API
        id: trigger_backup
        shell: bash
        run: |
          set +e
          echo "Envoi de la requete de backup a $BACKUP_TRIGGER_URL"
          http_status=$(curl -sS \
            -D /tmp/backup_headers.txt \
            -o /tmp/backup_response.json \
            -w "%{http_code}" \
            -X POST "$BACKUP_TRIGGER_URL" \
            -H "X-Backup-Token: ${{ secrets.BACKUP_TRIGGER_TOKEN }}" \
            -H "X-Backup-Retention-Days: $BACKUP_RETENTION_DAYS" \
            -H "X-HuggingFace-Sync: 1" \
            -H "X-HuggingFace-Required: $HUGGINGFACE_SYNC_REQUIRED" \
            -H "Accept: application/json" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5)

          echo "HTTP Status: $http_status"
          echo "Response headers:"
          cat /tmp/backup_headers.txt || true
          echo "Response body:"
          cat /tmp/backup_response.json || true

          trigger_ok=false
          job_id=""
          backup_error=""

          if [ "$http_status" = "200" ]; then
            job_id=$(python3 -c "import json, pathlib; path = pathlib.Path('/tmp/backup_response.json'); raw = path.read_text() if path.exists() else ''; data = json.loads(raw) if raw.strip() else {}; print(data.get('job_id', ''))")
            if [ -n "$job_id" ]; then
              trigger_ok=true
            else
              backup_error="Reponse 200 recue sans job_id."
            fi
          elif [ "$http_status" = "302" ]; then
            backup_error="Le serveur a repondu 302. La route de backup semble encore rediriger vers la page de connexion."
          elif [ "$http_status" = "403" ]; then
            backup_error="Token invalide. Verifiez le secret BACKUP_TRIGGER_TOKEN cote GitHub et cote serveur."
          elif [ "$http_status" = "503" ]; then
            backup_error="BACKUP_TRIGGER_TOKEN non configure sur le serveur."
          else
            backup_error="Le serveur a retourne le statut $http_status."
          fi

          echo "trigger_ok=$trigger_ok" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "backup_error=$backup_error" >> "$GITHUB_OUTPUT"

      - name: Poll backup status
        id: poll_backup
        if: always()
        shell: bash
        env:
          TRIGGER_OK: ${{ steps.trigger_backup.outputs.trigger_ok }}
          TRIGGER_JOB_ID: ${{ steps.trigger_backup.outputs.job_id }}
          TRIGGER_BACKUP_ERROR: ${{ steps.trigger_backup.outputs.backup_error }}
          BACKUP_TRIGGER_TOKEN_VALUE: ${{ secrets.BACKUP_TRIGGER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request


          def write_output(name, value):
              sanitized = str(value or "").replace("\r", " ").replace("\n", " ")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={sanitized}\n")


          def env(name, default=""):
              return os.getenv(name, default).strip()


          backup_status = "not_started"
          backup_failed = False
          backup_error = env("TRIGGER_BACKUP_ERROR")
          huggingface_status = "not_started"
          huggingface_message = ""
          trigger_ok = env("TRIGGER_OK").lower() == "true"
          job_id = env("TRIGGER_JOB_ID")
          token = env("BACKUP_TRIGGER_TOKEN_VALUE")
          base_url = env("BACKUP_STATUS_URL_BASE").rstrip("/")

          if not trigger_ok or not job_id:
              print("Le backup n'a pas pu etre demarre, le polling est saute.")
              backup_failed = True
              write_output("backup_status", backup_status)
              write_output("backup_failed", str(backup_failed).lower())
              write_output("backup_error", backup_error)
              write_output("huggingface_status", huggingface_status)
              write_output("huggingface_message", huggingface_message)
              raise SystemExit(0)

          status_url = f"{base_url}/{urllib.parse.quote(job_id, safe='')}/"

          for attempt in range(1, 31):
              request = urllib.request.Request(
                  status_url,
                  headers={
                      "X-Backup-Token": token,
                      "Accept": "application/json",
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      http_status = response.status
                      raw_body = response.read()
              except urllib.error.HTTPError as exc:
                  http_status = exc.code
                  raw_body = exc.read()
              except urllib.error.URLError as exc:
                  http_status = "network_error"
                  raw_body = str(exc.reason).encode("utf-8", errors="replace")

              body = raw_body.decode("utf-8", errors="replace")
              print(f"Polling tentative {attempt} - HTTP {http_status}")
              print(body)

              if http_status != 200:
                  backup_status = "error"
                  backup_failed = True
                  backup_error = f"Impossible de lire le statut du backup (HTTP {http_status})."
                  break

              try:
                  data = json.loads(body) if body.strip().startswith("{") else {}
              except json.JSONDecodeError:
                  data = {}

              hf = data.get("huggingface") or {}
              backup_status = data.get("status", "unknown")
              message_value = data.get("message", "") or data.get("error", "")
              huggingface_status = hf.get("status", "unknown")
              huggingface_message = hf.get("message", "") or hf.get("error", "")
              print(f"Backup status: {backup_status}")
              print(f"Hugging Face status: {huggingface_status}")

              if backup_status == "success":
                  backup_failed = False
                  backup_error = ""
                  break

              if backup_status == "partial":
                  backup_failed = True
                  backup_error = message_value or "Le backup s'est termine avec des erreurs partielles."
                  break

              if backup_status == "error":
                  backup_failed = True
                  backup_error = message_value or "Le backup a echoue."
                  break

              time.sleep(30)

          if backup_status not in {"success", "partial", "error"}:
              backup_failed = True
              backup_error = backup_error or "Le backup n'a pas termine dans la fenetre de surveillance."

          write_output("backup_status", backup_status)
          write_output("backup_failed", str(backup_failed).lower())
          write_output("backup_error", backup_error)
          write_output("huggingface_status", huggingface_status)
          write_output("huggingface_message", huggingface_message)
          PY

      - name: Verify Hugging Face Space health
        id: verify_huggingface
        if: always()
        shell: bash
        run: |
          hf_ok=false
          hf_error=""

          if [ "${{ steps.poll_backup.outputs.backup_failed }}" = "true" ]; then
            hf_error="Verification Hugging Face ignoree car le backup a echoue."
          else
            deadline=$((SECONDS + HUGGINGFACE_HEALTH_MAX_SECONDS))
            attempt=1
            auth_headers=(-H "Accept: application/json" -H "Authorization: Bearer $HUGGINGFACE_HEALTH_TOKEN")
            while [ "$SECONDS" -lt "$deadline" ]; do
              http_status=$(curl -sS \
                -o /tmp/hf_health.json \
                -w "%{http_code}" \
                "$HUGGINGFACE_SPACE_URL/health" \
                "${auth_headers[@]}" \
                --max-time 20 || true)

              echo "Hugging Face health tentative $attempt - HTTP $http_status"
              cat /tmp/hf_health.json || true

              if [ "$http_status" = "200" ]; then
                hf_ok=true
                hf_error=""
                break
              fi

              hf_error="Le Space Hugging Face n'a pas retourne HTTP 200 dans la fenetre de ${HUGGINGFACE_HEALTH_MAX_SECONDS}s."
              attempt=$((attempt + 1))
              sleep 10
            done
          fi

          echo "hf_ok=$hf_ok" >> "$GITHUB_OUTPUT"
          echo "hf_error=$hf_error" >> "$GITHUB_OUTPUT"

      - name: Wait until digest time
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          from datetime import datetime, timezone

          target = os.getenv("DIGEST_TRIGGER_UTC", "15:30")
          hour, minute = [int(part) for part in target.split(":", 1)]
          now = datetime.now(timezone.utc)
          target_dt = now.replace(hour=hour, minute=minute, second=0, microsecond=0)

          if now >= target_dt:
              print("Le job est deja au-dela de l'horaire du digest, aucun delai supplementaire.")
          else:
              wait_seconds = int((target_dt - now).total_seconds())
              print(f"Attente de {wait_seconds} seconde(s) avant l'envoi du digest.")
              time.sleep(wait_seconds)
          PY

      - name: Send daily digest email
        id: send_digest
        if: always()
        shell: bash
        run: |
          set +e
          echo "Envoi du digest quotidien a $REPORT_DIGEST_TRIGGER_URL"
          http_status=$(curl -sS \
            -o /tmp/digest_response.json \
            -w "%{http_code}" \
            -X POST "$REPORT_DIGEST_TRIGGER_URL" \
            -H "X-Report-Token: ${{ secrets.BACKUP_TRIGGER_TOKEN }}" \
            -H "Accept: application/json" \
            --data-urlencode "job_id=${{ steps.trigger_backup.outputs.job_id }}" \
            --data-urlencode "backup_error=${{ steps.poll_backup.outputs.backup_error }}" \
            --data-urlencode "recipients=$DAILY_DIGEST_RECIPIENTS" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5)

          echo "HTTP Status: $http_status"
          echo "Response:"
          cat /tmp/digest_response.json || true

          digest_ok=false
          digest_error=""
          if [ "$http_status" = "200" ]; then
            digest_ok=true
          else
            detail=$(python3 - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("/tmp/digest_response.json")
          raw = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
          try:
              data = json.loads(raw) if raw.strip().startswith("{") else {}
          except json.JSONDecodeError:
              data = {}
          print(data.get("detail", "") or data.get("error", ""))
          PY
            )
            digest_error="${detail:-Le digest quotidien a echoue avec le statut HTTP $http_status.}"
          fi

          echo "digest_ok=$digest_ok" >> "$GITHUB_OUTPUT"
          echo "digest_error=$digest_error" >> "$GITHUB_OUTPUT"

      - name: Fail on backup or digest issues
        if: always()
        shell: bash
        run: |
          failed=false

          if [ "${{ steps.trigger_backup.outputs.trigger_ok }}" != "true" ]; then
            echo "::error::Le declenchement du backup a echoue. ${{ steps.trigger_backup.outputs.backup_error }}"
            failed=true
          fi

          if [ "${{ steps.poll_backup.outputs.backup_failed }}" = "true" ]; then
            echo "::error::Le backup quotidien s'est termine en erreur. ${{ steps.poll_backup.outputs.backup_error }}"
            failed=true
          fi

          if [ "${{ steps.verify_huggingface.outputs.hf_ok }}" != "true" ]; then
            echo "::error::Verification Hugging Face echouee. ${{ steps.verify_huggingface.outputs.hf_error }}"
            failed=true
          fi

          if [ "${{ steps.send_digest.outputs.digest_ok }}" != "true" ]; then
            echo "::error::L'envoi du digest quotidien a echoue. ${{ steps.send_digest.outputs.digest_error }}"
            failed=true
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi

          echo "Backup et digest termines avec succes."
