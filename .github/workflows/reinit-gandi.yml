name: Reinit Gandi Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Tape REINIT_PROD pour relancer la configuration production"
        required: true
        default: "REINIT_PROD"
      reason:
        description: "Raison courte de la reinitialisation"
        required: false
        default: "Reinit Microsoft Graph / Teams"

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: gandi-production-deploy
  cancel-in-progress: false

jobs:
  reinit:
    name: Reinit production runtime
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: call.naumur.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://call.naumur.com
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      REPORT_EMAIL_TO: keunicetchoup@gmail.com,tanayves96@gmail.com,crepinkoulo@gmail.com,djonmarcel84@gmail.com,brayaneyoum@naumur.com
      DEPLOYMENT_REPORT_EMAIL_TO: ${{ secrets.DEPLOYMENT_REPORT_EMAIL_TO }}
      DEPLOYMENT_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      BACKUP_TRIGGER_TOKEN: ${{ secrets.BACKUP_TRIGGER_TOKEN }}
      REPORT_TRIGGER_TOKEN: ${{ secrets.BACKUP_TRIGGER_TOKEN }}
      BACKUP_RETENTION_DAYS: "30"
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN || secrets.HF_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      HUGGINGFACE_SPACE_REPO_ID: JackBrayan17/padesce-bot
      HUGGINGFACE_SPACE_REPO_TYPE: space
      HUGGINGFACE_SPACE_REVISION: main
      HUGGINGFACE_SPACE_DB_PATH: db.sqlite3
      HUGGINGFACE_SPACE_META_PATH: db_metadata.json
      HUGGINGFACE_SPACE_URL: https://jackbrayan17-padesce-bot.hf.space
      HUGGINGFACE_BACKUP_SOURCE_URL: https://call.naumur.com
      HUGGINGFACE_BACKUP_SYNC_ENABLED: "True"
      HUGGINGFACE_BACKUP_SYNC_REQUIRED: "True"
      HUGGINGFACE_BACKUP_COMMIT_PREFIX: Update PADESCE SQLite backup
      PADESCE_CHAT_API_URL: https://jackbrayan17-padesce-bot.hf.space
      PADESCE_CHAT_API_TIMEOUT: "300"
      PADESCE_CHAT_API_TOKEN: ${{ secrets.PADESCE_CHAT_API_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HF_TOKEN }}
      PADESCE_RAG_API_URL: https://jackbrayan17-padesce-bot.hf.space
      PADESCE_RAG_API_TOKEN: ${{ secrets.PADESCE_RAG_API_TOKEN || secrets.PADESCE_CHAT_API_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HF_TOKEN }}
      GANDI_SFTP_HOST: ${{ secrets.GANDI_SFTP_HOST }}
      GANDI_SFTP_PORT: ${{ secrets.GANDI_SFTP_PORT }}
      GANDI_SFTP_DOMAIN: call.naumur.com
      GANDI_SFTP_USERNAME: ${{ secrets.GANDI_SFTP_USERNAME }}
      GANDI_SFTP_TOKEN: ${{ secrets.GANDI_SFTP_TOKEN }}
      GANDI_SFTP_REMOTE_PATH: ${{ secrets.GANDI_SFTP_REMOTE_PATH }}
      GANDI_DEPLOY_VERIFY_URL: https://call.naumur.com
      GANDI_DEPLOY_INCLUDE_PATHS: App_PADESCE,agent_padesceV2,templates,static,staticfiles,admin,data,docs,manage.py,requirements.txt,Dockerfile,docker-compose.yml,start-command,Decompte et facturation.xlsm
      EXPORT_API_KEY: ${{ secrets.EXPORT_API_KEY || vars.EXPORT_API_KEY }}
      CGA_PUBLIC_API_KEY: ${{ secrets.CGA_PUBLIC_API_KEY || vars.CGA_PUBLIC_API_KEY }}
      MICROSOFT_GRAPH_CLIENT_ID: 55cfc688-1206-496c-9a91-f6fd9f63400c
      MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
      MICROSOFT_GRAPH_TENANT_ID: 2c91375e-f3f5-486e-8fdd-c8273053bd5d
      MICROSOFT_GRAPH_PRIMARY_DOMAIN: naumur.com
      MICROSOFT_GRAPH_REDIRECT_URI: https://call.naumur.com/auth/microsoft/callback
      MICROSOFT_TEAMS_DEFAULT_TEAM_ID: adaabb1b-7e2d-4d41-ae0e-a98239ad0cd5
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    environment:
      name: production
      url: https://call.naumur.com/deploiement/
    steps:
      - name: Confirm production reinit
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "REINIT_PROD" ]; then
            echo "::error::Confirmation invalide. Tape REINIT_PROD."
            exit 1
          fi
          echo "Reinit reason: ${{ github.event.inputs.reason }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runtime secrets
        run: |
          if [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "::error::DJANGO_SECRET_KEY is missing."
            exit 1
          fi
          if [ -z "$CGA_PUBLIC_API_KEY" ]; then
            echo "::error::CGA_PUBLIC_API_KEY is missing."
            exit 1
          fi
          if [ "$MICROSOFT_GRAPH_CLIENT_ID" != "55cfc688-1206-496c-9a91-f6fd9f63400c" ]; then
            echo "::error::MICROSOFT_GRAPH_CLIENT_ID does not match the Azure app Assistant."
            exit 1
          fi
          if [ -z "$MICROSOFT_GRAPH_CLIENT_SECRET" ]; then
            echo "::error::MICROSOFT_GRAPH_CLIENT_SECRET is missing."
            exit 1
          fi
          if [[ "$MICROSOFT_GRAPH_CLIENT_SECRET" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::MICROSOFT_GRAPH_CLIENT_SECRET looks like a Secret ID. Use the Azure client secret Value."
            exit 1
          fi

      - name: Validate Django configuration
        run: python manage.py check

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Mirror collected static assets to public static path
        run: |
          mkdir -p static
          cp -a staticfiles/. static/

      - name: Verify collected static assets
        run: |
          test -f staticfiles/staticfiles.json
          test -f staticfiles/branding/logo.png
          test -f staticfiles/core/chat_widget.css
          test -f staticfiles/core/chat_widget.js
          test -f staticfiles/core/call_alert_widget.js
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("staticfiles/staticfiles.json").read_text())
          paths = manifest.get("paths", {})
          required = [
              "branding/logo.png",
              "core/chat_widget.css",
              "core/chat_widget.js",
              "core/call_alert_widget.js",
          ]
          for source in required:
              hashed = paths.get(source)
              if not hashed:
                  raise SystemExit(f"Missing static manifest entry: {source}")
              if not (Path("static") / hashed).is_file():
                  raise SystemExit(f"Missing mirrored static asset: static/{hashed}")
          PY

      - name: Reinit production deployment
        run: python manage.py gandi_deploy --mode deploy

      - name: Verify public logo and chatbot assets
        run: |
          python - <<'PY'
          import re
          import sys
          from urllib.parse import urljoin

          import requests

          base_url = "https://call.naumur.com"
          login_url = urljoin(base_url, "/login/")
          response = requests.get(login_url, timeout=30)
          response.raise_for_status()

          static_urls = sorted(
              set(re.findall(r"""(?:src|href)=["']([^"']*/static/[^"']+)["']""", response.text))
          )
          required_markers = [
              "branding/logo",
              "core/chat_widget",
          ]
          checked = []
          failures = []
          for marker in required_markers:
              matches = [url for url in static_urls if marker in url]
              if not matches:
                  failures.append(f"No public static URL found for {marker}")
                  continue
              for url in matches:
                  full_url = urljoin(base_url, url)
                  asset = requests.get(full_url, timeout=30)
                  checked.append(full_url)
                  if asset.status_code >= 400:
                      failures.append(f"{asset.status_code} {full_url}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("Verified public static assets:")
          for url in checked:
              print(f"- {url}")
          PY

      - name: Upload reinit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandi-reinit-${{ github.run_id }}
          path: |
            logs/
            staticfiles/staticfiles.json
          if-no-files-found: ignore
