name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branch: ${BRANCH_NAME}"
          if [[ ! "${BRANCH_NAME}" =~ ^(feature|fix|hotfix|chore|docs|release|codex|claude)/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Nom de branche invalide. Utilisez feature/... fix/... chore/... docs/... hotfix/... release/... codex/... ou claude/..."
            exit 1
          fi

      - name: Block direct work on main
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${BRANCH_NAME}" == "main" ]]; then
            echo "::error::Le travail direct sur main est interdit. Creez une branche dediee."
            exit 1
          fi

  black-and-lint:
    name: Black and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Collect changed Python files
        id: changed-python
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          # Vérifier si le BASE_SHA existe localement (peut manquer après un "force push" ou un squash)
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} introuvable (probablement un force push). Utilisation de HEAD~1 comme alternative."
            BASE_SHA="HEAD~1"
            # Si HEAD~1 n'existe pas non plus (ex. repo avec 1 seul commit)
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$(git hash-object -t tree /dev/null)"
            fi
          fi

          python_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- '*.py')"

          {
            echo "files<<EOF"
            printf "%s\n" "${python_files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Black and Ruff on changed Python files
        env:
          CHANGED_PYTHON_FILES: ${{ steps.changed-python.outputs.files }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          raw = [line.strip() for line in os.environ.get("CHANGED_PYTHON_FILES", "").splitlines() if line.strip()]
          # Keep only files that exist in the current checkout (skip deleted / moved files)
          files = [f for f in raw if os.path.isfile(f)]
          if not files:
              print("No changed Python files to check.")
              raise SystemExit(0)

          print(f"Checking {len(files)} file(s) (skipped {len(raw) - len(files)} missing):")
          for f in files:
              print(f"  {f}")

          subprocess.run([sys.executable, "-m", "black", "--check", *files], check=True)
          subprocess.run([sys.executable, "-m", "ruff", "check", *files], check=True)
          PY

  django-check:
    name: Django Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
        run: python manage.py check

  deployment-tests:
    name: Deployment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deployment test suite
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
          DEPLOYMENT_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          DEPLOYMENT_REPORT_EMAIL_TO: jackbrayan1707@gmail.com
        run: |
          python manage.py test App_PADESCE.core.test_gandi_deploy App_PADESCE.core.test_deployment_reporting
